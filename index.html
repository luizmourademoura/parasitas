<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consulta de Medicamentos para Aquarismo</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 0;
        }

        header {
            background-color: #004d63; /* Azul petróleo */
            color: white;
            text-align: center;
            padding: 15px 0;
        }

        h1 {
            margin: 0;
        }

        .container {
            max-width: 1200px;
            margin: 20px auto;
            padding: 20px;
            background-color: white;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        .box-medicamento {
            margin-bottom: 20px;
        }

        select, .output {
            width: 100%;
            padding: 12px;
            font-size: 16px;
            margin-top: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        label {
            font-weight: bold;
        }

        .output {
            margin-top: 20px;
            background-color: #e7f3f3;
        }

        footer {
            text-align: center;
            margin-top: 40px;
            padding: 10px;
            background-color: #004d63; /* Azul petróleo */
            color: white;
        }

        @media (max-width: 768px) {
            body {
                font-size: 14px;
            }

            select, .output {
                padding: 10px;
            }

            .box-medicamento {
                margin-bottom: 15px;
            }
        }
    </style>
</head>
<body>

<header>
    <h1>Consulta de Medicamentos para Aquarismo</h1>
</header>

<div class="container">
    <div class="box-medicamento">
        <label for="medicamento">Escolha o medicamento:</label>
        <select id="medicamento" onchange="exibirInformacoes()">
            <option value="">Selecione</option>
            <option value="Mebendazol">Mebendazol</option>
            <option value="Niclosamida">Niclosamida</option>
            <option value="Albendazol">Albendazol</option>
            <option value="Piperazina">Piperazina</option>
            <option value="Formol">Formol</option>
            <option value="Sulfato de Cobre">Sulfato de Cobre</option>
            <option value="Fembendazol">Fembendazol</option>
            <option value="Azul de Metileno">Azul de Metileno</option>
            <option value="Verde de Malaquita">Verde de Malaquita</option>
            <option value="Permanganato de Potássio">Permanganato de Potássio</option>
            <option value="Sulfato de Neomicina">Sulfato de Neomicina</option>
            <option value="Ácido Oxolínico">Ácido Oxolínico</option>
            <option value="Nitrofurantoína">Nitrofurantoína</option>
            <option value="Azitromicina">Azitromicina</option>
            <option value="Metronidazol">Metronidazol</option>
            <option value="Praziquantel">Praziquantel</option>
            <option value="Triclorfon">Triclorfon</option>
        </select>
    </div>

    <div class="output" id="informacoesMedicamento">
        <!-- Informações do medicamento aparecerão aqui -->
    </div>
</div>

<footer>
    <p>&copy; 2025 PLAM Aquarismo</p>
</footer>

<script>
    function exibirInformacoes() {
        var medicamento = document.getElementById("medicamento").value;
        var informacoes = "";

        switch (medicamento) {
            case "Mebendazol":
                informacoes = "<h2>Mebendazol</h2><p>Usado para tratar vermes intestinais em peixes.</p><p><strong>Dosagem:</strong> 1 mg/L</p><p><strong>Duracao da dosagem:</strong> 7 dias</p><p><strong>Repeticao:</strong> a cada 3 dias</p><p><strong>Sintomas:</strong> Perda de apetite, letargia, movimentos anormais.</p>";
                break;
            case "Niclosamida":
                informacoes = "<h2>Niclosamida</h2><p>Antiparasitário eficaz contra vermes intestinais.</p><p><strong>Dosagem:</strong> 0,5 mg/L</p><p><strong>Duracao da dosagem:</strong> 5 dias</p><p><strong>Repeticao:</strong> após 7 dias se necessário</p><p><strong>Sintomas:</strong> Perda de peso, comportamento inativo, nadadeiras retraídas.</p>";
                break;
            case "Albendazol":
                informacoes = "<h2>Albendazol</h2><p>Tratamento para vermes intestinais.</p><p><strong>Dosagem:</strong> 0,5 mg/L</p><p><strong>Duracao da dosagem:</strong> 5 dias</p><p><strong>Repeticao:</strong> após 7 dias</p><p><strong>Sintomas:</strong> Letargia, falta de apetite, nadadeiras fechadas.</p>";
                break;
            case "Piperazina":
                informacoes = "<h2>Piperazina</h2><p>Utilizada para combater parasitas intestinais.</p><p><strong>Dosagem:</strong> 1 mg/L</p><p><strong>Duracao da dosagem:</strong> 4 dias</p><p><strong>Repeticao:</strong> a cada 7 dias</p><p><strong>Sintomas:</strong> Perda de apetite, comportamento letárgico.</p>";
                break;
            case "Formol":
                informacoes = "<h2>Formol</h2><p>Usado como desinfetante e para controle de parasitas externos.</p><p><strong>Dosagem:</strong> 0,25 mL/L</p><p><strong>Duracao da dosagem:</strong> 2 horas</p><p><strong>Repeticao:</strong> não recomendado repetidamente</p><p><strong>Sintomas:</strong> Alterações comportamentais, respiração ofegante.</p>";
                break;
            case "Sulfato de Cobre":
                informacoes = "<h2>Sulfato de Cobre</h2><p>Usado para tratar infecções fúngicas e parasitárias.</p><p><strong>Dosagem:</strong> 0,15 mg/L</p><p><strong>Duracao da dosagem:</strong> 3 dias</p><p><strong>Repeticao:</strong> após 7 dias se necessário</p><p><strong>Sintomas:</strong> Comportamento incomum, perda de cor.</p>";
                break;
            case "Fembendazol":
                informacoes = "<h2>Fembendazol</h2><p>Antiparasitário eficaz contra vermes intestinais.</p><p><strong>Dosagem:</strong> 1 mg/L</p><p><strong>Duracao da dosagem:</strong> 5 dias</p><p><strong>Repeticao:</strong> a cada 7 dias</p><p><strong>Sintomas:</strong> Falta de apetite, movimentos fracos.</p>";
                break;
            case "Azul de Metileno":
                informacoes = "<h2>Azul de Metileno</h2><p>Usado no tratamento de infecções fúngicas e parasitárias.</p><p><strong>Dosagem:</strong> 0,1 mg/L</p><p><strong>Duracao da dosagem:</strong> 3 dias</p><p><strong>Repeticao:</strong> após 7 dias</p><p><strong>Sintomas:</strong> Comportamento letárgico, nadadeiras retraídas.</p>";
                break;
            case "Verde de Malaquita":
                informacoes = "<h2>Verde de Malaquita</h2><p>Utilizado para controlar fungos e parasitas externos.</p><p><strong>Dosagem:</strong> 0,1 mg/L</p><p><strong>Duracao da dosagem:</strong> 3 dias</p><p><strong>Repeticao:</strong> após 7 dias se necessário</p><p><strong>Sintomas:</strong> Movimentos anormais, falta de apetite.</p>";
                break;
            case "Permanganato de Potássio":
                informacoes = "<h2>Permanganato de Potássio</h2><p>Usado para tratar infecções parasitárias e bacterianas.</p><p><strong>Dosagem:</strong> 0,5 mg/L</p><p><strong>Duracao da dosagem:</strong> 1 hora</p><p><strong>Repeticao:</strong> após 7 dias</p><p><strong>Sintomas:</strong> Comportamento agitado, nadadeiras retraídas.</p>";
                break;
            case "Sulfato de Neomicina":
                informacoes = "<h2>Sulfato de Neomicina</h2><p>Antibiótico utilizado para infecções bacterianas.</p><p><strong>Dosagem:</strong> 1 mg/L</p><p><strong>Duracao da dosagem:</strong> 5 dias</p><p><strong>Repeticao:</strong> após 7 dias se necessário</p><p><strong>Sintomas:</strong> Lesões na pele, nadadeiras danificadas.</p>";
                break;
            case "Ácido Oxolínico":
                informacoes = "<h2>Ácido Oxolínico</h2><p>Tratamento para infecções bacterianas e virais.</p><p><strong>Dosagem:</strong> 0,1 mg/L</p><p><strong>Duracao da dosagem:</strong> 3 dias</p><p><strong>Repeticao:</strong> após 7 dias</p><p><strong>Sintomas:</strong> Perda de apetite, falta de energia.</p>";
                break;
            case "Nitrofurantoína":
                informacoes = "<h2>Nitrofurantoína</h2><p>Antibiótico utilizado no tratamento de infecções bacterianas.</p><p><strong>Dosagem:</strong> 0,5 mg/L</p><p><strong>Duracao da dosagem:</strong> 5 dias</p><p><strong>Repeticao:</strong> após 7 dias</p><p><strong>Sintomas:</strong> Letargia, perda de apetite.</p>";
                break;
            case "Azitromicina":
                informacoes = "<h2>Azitromicina</h2><p>Antibiótico utilizado para infecções bacterianas.</p><p><strong>Dosagem:</strong> 1 mg/L</p><p><strong>Duracao da dosagem:</strong> 3 dias</p><p><strong>Repeticao:</strong> após 7 dias se necessário</p><p><strong>Sintomas:</strong> Movimentos anormais, perda de apetite.</p>";
                break;
            case "Metronidazol":
                informacoes = "<h2>Metronidazol</h2><p>Usado para tratar infecções parasitárias.</p><p><strong>Dosagem:</strong> 1 mg/L</p><p><strong>Duracao da dosagem:</strong> 7 dias</p><p><strong>Repeticao:</strong> a cada 7 dias</p><p><strong>Sintomas:</strong> Perda de apetite, letargia.</p>";
                break;
            case "Praziquantel":
                informacoes = "<h2>Praziquantel</h2><p>Tratamento contra parasitas internos.</p><p><strong>Dosagem:</strong> 0,5 mg/L</p><p><strong>Duracao da dosagem:</strong> 5 dias</p><p><strong>Repeticao:</strong> a cada 7 dias</p><p><strong>Sintomas:</strong> Perda de peso, letargia.</p>";
                break;
            case "Triclorfon":
                informacoes = "<h2>Triclorfon</h2><p>Utilizado no controle de parasitas externos.</p><p><strong>Dosagem:</strong> 1 mg/L</p><p><strong>Duracao da dosagem:</strong> 1 hora</p><p><strong>Repeticao:</strong> após 7 dias</p><p><strong>Sintomas:</strong> Movimentos anormais, respiração ofegante.</p>";
                break;
            default:
                informacoes = "<h2>Selecione um medicamento</h2><p>Escolha um medicamento para ver as informações correspondentes.</p>";
        }

        document.getElementById("informacoesMedicamento").innerHTML = informacoes;
    }
</script>

</body>
</html>
