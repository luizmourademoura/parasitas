<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#81d4fa">
  <link rel="manifest" href="manifest.json">
  <title>Consulta Medicamentos - PLAM</title>
  <style>
    body {
      font-family: sans-serif;
      background: #f4f6f8;
      padding: 20px;
      margin: 0;
      color: #222;
    }

    h2 {
      font-size: 1.5em;
      text-align: center;
    }

    label {
      font-weight: bold;
      display: block;
      margin-top: 20px;
      font-size: 1.1em;
    }

    select {
      width: 100%;
      padding: 12px;
      margin-top: 10px;
      font-size: 1em;
      border-radius: 6px;
      border: 1px solid #ccc;
    }

    .info-box {
      background: #e0f7fa;
      border: 1px solid #81d4fa;
      border-radius: 6px;
      padding: 15px;
      margin-top: 20px;
      display: none;
    }

    .info-box h3 {
      margin-top: 0;
    }

    p {
      margin: 8px 0;
    }
  </style>
</head>
<body>
  <h2>Consulta Rápida de Medicamentos</h2>
  <label for="medicamento">Escolha um medicamento:</label>
  <select id="medicamento" onchange="mostrarInfo()">
    <option value="">-- Selecione --</option>
    <option value="metronidazol">Metronidazol</option>
    <option value="mebendazol">Mebendazol</option>
    <option value="levamisol">Levamisol HCl</option>
    <option value="praziquantel">Praziquantel</option>
    <option value="niclosamida">Niclosamida</option>
    <option value="albendazol">Albendazol</option>
    <option value="piperazina">Piperazina</option>
    <option value="formol">Formol (37%)</option>
    <option value="cobre">Sulfato de Cobre</option>
    <option value="triclorfon">Triclorfon (Dipterex)</option>
    <option value="fembendazol">Fembendazol</option>
    <option value="azulmetileno">Azul de Metileno</option>
    <option value="verde">Verde de Malaquita</option>
    <option value="permanganato">Permanganato de Potássio</option>
    <option value="neomicina">Sulfato de Neomicina</option>
    <option value="oxolinico">Ácido Oxolínico</option>
    <option value="nalidixico">Ácido Nalidíxico</option>
    <option value="nitrofurantoina">Nitrofurantoína</option>
    <option value="furozolidona">Furozolidona</option>
    <option value="azitromicina">Azitromicina</option>
    <option value="quinina">Cloridrato de Quinina</option>
    <option value="ascorbico">Ácido Ascórbico</option>
    <option value="cloranfenicol">Cloranfenicol</option>
    <option value="oxitetraciclina">Oxitetraciclina</option>
  </select>

  <div id="info" class="info-box"></div>

  <script>
    const dados = {
      metronidazol: {
        nome: "Metronidazol",
        acao: "Protozoários internos (Hexamita, Spironucleus, Entamoeba)",
        dosagem: "10–25 mg/L (banho por 8–12h) ou 200–400 mg/100g alimento",
        uso: "Banho ou ração medicada",
        duracao: "3 a 5 dias consecutivos",
        repeticao: "Repetir após 7 dias se necessário",
        obs: "Inativo em meio aeróbico; usar em tanque hospital",
        sintomas: "Diarreia, secreção intestinal excessiva, perda de apetite",
      },
      mebendazol: {
        nome: "Mebendazol",
        acao: "Nematódeos (Camallanus, Capillaria)",
        dosagem: "1–2 mg/L (banho 6–8h) ou 100–200 mg/100g alimento",
        uso: "Banho ou ração medicada",
        duracao: "3 dias seguidos ou dose única em banhos",
        repeticao: "Repetir após 10 dias",
        obs: "Pouco solúvel; usar suspensão homogênea",
        sintomas: "Vermes visíveis nas fezes, emagrecimento, letargia",
      },
      levamisol: {
        nome: "Levamisol HCl",
        acao: "Nematódeos, Camallanus e similares",
        dosagem: "2 mg/L por 24h ou 1–2 mg/kg peixe/dia",
        uso: "Banho ou via oral (ração)",
        duracao: "1 dia (banho) ou 3 dias (ração)",
        repeticao: "Repetir após 7 a 10 dias",
        obs: "Estimula sistema imune; seguro em pH neutro",
        sintomas: "Crescimento retardado, dificuldade de natação, abdômen distendido",
      },
      praziquantel: {
        nome: "Praziquantel",
        acao: "Cestódeos (tênias), Monogenéticos (externos)",
        dosagem: "2 mg/L (banho prolongado) ou 50–100 mg/100g alimento",
        uso: "Banho ou oral",
        duracao: "1–3 dias (ração); 6–12h (banho)",
        repeticao: "Repetir após 5–7 dias",
        obs: "Insolúvel em água; pré-dissolver em álcool",
        sintomas: "Presença de vermes visíveis ou contagem de ovos nas fezes",
      },
      niclosamida: {
        nome: "Niclosamida",
        acao: "Cestódeos (tênias)",
        dosagem: "1–2 mg/L (banho prolongado) ou 50–100 mg/100g alimento",
        uso: "Banho ou via oral",
        duracao: "1–3 dias (ração); 6–12h (banho)",
        repeticao: "Repetir após 5–7 dias",
        obs: "Insolúvel em água; pré-dissolver em álcool",
        sintomas: "Presença de vermes visíveis ou contagem de ovos nas fezes",
      },
      azulmetileno: {
        nome: "Azul de Metileno",
        acao: "Protozoários, fungos, bactérias",
        dosagem: "10–15 mg/L (banho de 30min a 1h)",
        uso: "Banho de imersão",
        duracao: "Banho único ou até 3 dias consecutivos",
        repeticao: "Pode repetir após 7 dias se necessário",
        obs: "Pode manchar aquário, usar em tanque hospital",
        sintomas: "Fungos visíveis, manchas na pele, natação descoordenada",
      },
      verde: {
        nome: "Verde de Malaquita",
        acao: "Protozoários, fungos, ectoparasitas",
        dosagem: "0,5–1 mg/L por 24–48h",
        uso: "Banho prolongado",
        duracao: "1–2 dias consecutivos",
        repeticao: "Repetir após 7 dias, se necessário",
        obs: "Tóxico em altas doses; usar com precaução",
        sintomas: "Fungos visíveis, manchas na pele, natação irregular",
      },
      permanganato: {
        nome: "Permanganato de Potássio",
        acao: "Oxidante, tratamento de parasitas e doenças bacterianas",
        dosagem: "1–2 mg/L (banho de 15 a 30min)",
        uso: "Banho curto",
        duracao: "Banho único",
        repeticao: "Não recomendado repetir sem teste",
        obs: "Requer controle de pH",
        sintomas: "Infecções bacterianas, feridas abertas, natação irregular",
      },
      neomicina: {
        nome: "Sulfato de Neomicina",
        acao: "Bactérias gram-negativas, infecções intestinais",
        dosagem: "10–20 mg/L (via oral) ou 50–100 mg/100g de alimento",
        uso: "Ração medicada ou via oral",
        duracao: "5 a 7 dias",
        repeticao: "Repetir após 10 dias",
        obs: "Não usar em peixe com lesões abertas",
        sintomas: "Diarreia, abdômen distendido, letargia",
      }
    };

    function mostrarInfo() {
      const medicamento = document.getElementById("medicamento").value;
      const infoBox = document.getElementById("info");
      infoBox.style.display = medicamento ? "block" : "none";

      if (medicamento && dados[medicamento]) {
        const medicamentoInfo = dados[medicamento];
        let html = `<h3>${medicamentoInfo.nome}</h3>`;
        html += `<p><strong>Ação:</strong> ${medicamentoInfo.acao}</p>`;
        html += `<p><strong>Dosagem:</strong> ${medicamentoInfo.dosagem}</p>`;
        html += `<p><strong>Uso:</strong> ${medicamentoInfo.uso}</p>`;
        html += `<p><strong>Duração:</strong> ${medicamentoInfo.duracao}</p>`;
        html += `<p><strong>Repetição:</strong> ${medicamentoInfo.repeticao}</p>`;
        html += `<p><strong>Observações:</strong> ${medicamentoInfo.obs}</p>`;
        html += `<p><strong>Sintomas:</strong> ${medicamentoInfo.sintomas}</p>`;
        infoBox.innerHTML = html;
      }
    }
  </script>
</body>
</html>
