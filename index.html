<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#81d4fa">
  <link rel="manifest" href="manifest.json">
  <title>Consulta Antiparasitários - PLAM</title>
  <style>
    body {
      font-family: sans-serif;
      background: #f4f6f8;
      padding: 20px;
      margin: 0;
      color: #222;
    }

    h2 {
      font-size: 1.5em;
      text-align: center;
    }

    label {
      font-weight: bold;
      display: block;
      margin-top: 20px;
      font-size: 1.1em;
    }

    select {
      width: 100%;
      padding: 12px;
      margin-top: 10px;
      font-size: 1em;
      border-radius: 6px;
      border: 1px solid #ccc;
    }

    .info-box {
      background: #e0f7fa;
      border: 1px solid #81d4fa;
      border-radius: 6px;
      padding: 15px;
      margin-top: 20px;
      display: none;
    }

    .info-box h3 {
      margin-top: 0;
    }

    p {
      margin: 8px 0;
    }
  </style>
</head>
<body>
  <h2>Consulta Rápida de Antiparasitários</h2>
  <label for="medicamento">Escolha um medicamento:</label>
  <select id="medicamento" onchange="mostrarInfo()">
    <option value="">-- Selecione --</option>
    <option value="metronidazol">Metronidazol</option>
    <option value="mebendazol">Mebendazol</option>
    <option value="levamisol">Levamisol HCl</option>
    <option value="praziquantel">Praziquantel</option>
    <option value="albendazol">Albendazol</option>
    <option value="piperazina">Piperazina</option>
    <option value="formol">Formol (37%)</option>
    <option value="cobre">Sulfato de Cobre</option>
    <option value="triclorfon">Triclorfon (Dipterex)</option>
    <option value="fembendazol">Fembendazol</option>
  </select>

  <div id="info" class="info-box"></div>

  <script>
    const dados = {
      metronidazol: {
        nome: "Metronidazol",
        acao: "Protozoários internos (Hexamita, Spironucleus, Entamoeba)",
        dosagem: "10–25 mg/L (banho por 8–12h) ou 200–400 mg/100g alimento",
        uso: "Banho ou ração medicada",
        duracao: "3 a 5 dias consecutivos",
        repeticao: "Repetir após 7 dias se necessário",
        obs: "Inativo em meio aeróbico; usar em tanque hospital",
        sintomas: "Diarreia, secreção intestinal excessiva, perda de apetite",
      },
      mebendazol: {
        nome: "Mebendazol",
        acao: "Nematódeos (Camallanus, Capillaria)",
        dosagem: "1–2 mg/L (banho 6–8h) ou 100–200 mg/100g alimento",
        uso: "Banho ou ração medicada",
        duracao: "3 dias seguidos ou dose única em banhos",
        repeticao: "Repetir após 10 dias",
        obs: "Pouco solúvel; usar suspensão homogênea",
        sintomas: "Vermes visíveis nas fezes, emagrecimento, letargia",
      },
      levamisol: {
        nome: "Levamisol HCl",
        acao: "Nematódeos, Camallanus e similares",
        dosagem: "2 mg/L por 24h ou 1–2 mg/kg peixe/dia",
        uso: "Banho ou via oral (ração)",
        duracao: "1 dia (banho) ou 3 dias (ração)",
        repeticao: "Repetir após 7 a 10 dias",
        obs: "Estimula sistema imune; seguro em pH neutro",
        sintomas: "Crescimento retardado, dificuldade de natação, abdômen distendido",
      },
      praziquantel: {
        nome: "Praziquantel",
        acao: "Cestódeos (tênias), Monogenéticos (externos)",
        dosagem: "2 mg/L (banho prolongado) ou 50–100 mg/100g alimento",
        uso: "Banho ou oral",
        duracao: "1–3 dias (ração); 6–12h (banho)",
        repeticao: "Repetir após 5–7 dias",
        obs: "Insolúvel em água; pré-dissolver em álcool",
        sintomas: "Presença de vermes visíveis ou contagem de ovos nas fezes",
      },
      albendazol: {
        nome: "Albendazol",
        acao: "Nematódeos, Cestódeos",
        dosagem: "10 mg/L (banho 6h) ou 100 mg/100g alimento",
        uso: "Banho ou ração medicada",
        duracao: "3 dias consecutivos",
        repeticao: "Repetir após 7 dias",
        obs: "Hepatotóxico em peixes sensíveis",
        sintomas: "Letargia, emagrecimento progressivo, vermes visíveis nas fezes",
      },
      piperazina: {
        nome: "Piperazina",
        acao: "Nematódeos",
        dosagem: "10 mg/L (banho de 24h)",
        uso: "Banho",
        duracao: "1 dia (banho único)",
        repeticao: "Repetir após 5 a 7 dias",
        obs: "Paralisa vermes intestinais",
        sintomas: "Diarreia, fezes com aparência viscosa",
      },
      formol: {
        nome: "Formol (37%)",
        acao: "Protozoários externos (Ichthyophthirius, Chilodonella)",
        dosagem: "25 mg/L por 30–60 min",
        uso: "Banho curto",
        duracao: "Banho único",
        repeticao: "Pode ser repetido após 48h com cuidado",
        obs: "Tóxico; usar com aeração",
        sintomas: "Manchas brancas na pele, natação descoordenada",
      },
      cobre: {
        nome: "Sulfato de Cobre",
        acao: "Protozoários externos, alguns helmintos",
        dosagem: "0,15–0,20 mg/L contínuo",
        uso: "Banho prolongado",
        duracao: "5–7 dias com controle de cobre ativo",
        repeticao: "Não recomendado repetir sem teste",
        obs: "Requer controle rígido de pH e KH",
        sintomas: "Lesões cutâneas, natação irregular, perda de escamas",
      },
      triclorfon: {
        nome: "Triclorfon (Dipterex)",
        acao: "Crustáceos parasitas (Argulus, Lernaea)",
        dosagem: "0,25–0,5 mg/L por 24h",
        uso: "Banho",
        duracao: "1 dia",
        repeticao: "Repetir após 5–7 dias até erradicação",
        obs: "Tóxico para invertebrados e plantas",
        sintomas: "Presença de parasitas visíveis no corpo do peixe",
      },
      fembendazol: {
        nome: "Fembendazol",
        acao: "Nematódeos, alguns cestódeos",
        dosagem: "1–2 mg/L ou 100 mg/100g ração",
        uso: "Banho ou oral",
        duracao: "5 dias consecutivos (oral)",
        repeticao: "Repetir após 10 dias",
        obs: "Ação lenta; repetir tratamento",
        sintomas: "Vermes intestinais, emagrecimento, falta de apetite",
      }
    };

    function mostrarInfo() {
      const med = document.getElementById("medicamento").value;
      const info = document.getElementById("info");
      if (dados[med]) {
        const d = dados[med];
        info.innerHTML = `<h3>${d.nome}</h3>
          <p><strong>Ação contra:</strong> ${d.acao}</p>
          <p><strong>Dosagem recomendada:</strong> ${d.dosagem}</p>
          <p><strong>Forma de uso:</strong> ${d.uso}</p>
          <p><strong>Duração do tratamento:</strong> ${d.duracao}</p>
          <p><strong>Repetição:</strong> ${d.repeticao}</p>
          <p><strong>Observações:</strong> ${d.obs}</p>
          <p><strong>Sintomas indicativos:</strong> ${d.sintomas}</p>`;
        info.style.display = "block";
      } else {
        info.style.display = "none";
      }
    }
  </script>
</body>
</html>
